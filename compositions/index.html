<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>compositions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=86" />
  </head>
  <body>
    <main class="studio">
      <aside class="desk">
        <div class="masthead">
          <h1>compositions</h1>
          <p class="about-label">what is this?</p>
          <div class="about-menu">
            <p>
              this is a mini generative art experiment, inspired by
              <a href="https://surya.website/rling-qwen-to-paint-with-code" target="_blank" rel="noopener noreferrer">this project on painting with code</a>.
            </p>
            <p>to get started upload an image or select a preset scene below. click paint to adjust each image.</p>
          </div>
        </div>
        <div class="stack">
          <div class="field">
            <span>scene</span>
            <div class="scene-row">
              <textarea id="scene" rows="2" placeholder="fingerprints" aria-label="scene"></textarea>
              <div class="scene-caption" id="sceneCaption" hidden>
                <img id="sceneCaptionImg" alt="" />
                <span id="sceneCaptionText"></span>
              </div>
              <label class="upload" id="photoChip" aria-label="upload photo" title="upload photo">
                <input id="photo" type="file" accept="image/*" />
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M12 16V5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <path
                    d="M8 8.5 12 4.5 16 8.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M5 16.5v1.2c0 1 .8 1.8 1.8 1.8h10.4c1 0 1.8-.8 1.8-1.8v-1.2"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </label>
            </div>
          </div>
          <details class="sample-kit" id="sampleKit" open>
            <summary>samples</summary>
            <div class="chips" id="samples"></div>
          </details>
        </div>

        <div class="stack">
          <div class="tools">
            <label class="slide">
              <span>variations</span>
              <select id="count">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
              </select>
            </label>
            <button id="paint" class="paint" type="button" aria-label="paint" title="paint">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <details class="paint-kit" id="paintKit">
          <summary>paint</summary>
          <div class="paint-kit-body">
            <details class="pane" id="brush">
              <summary>
                <span>brush</span>
                <button id="resetBrush" class="reset" type="button" aria-label="reset brush" title="reset">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M3.2 8A4.8 4.8 0 1 0 8 3.2"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <path d="M3.2 3.2v3.2H6.4" fill="none" stroke="currentColor" stroke-width="1.5" />
                  </svg>
                </button>
              </summary>
              <div id="brushControls"></div>
            </details>

            <details class="pane" id="placement">
              <summary>
                <span>placement</span>
                <button id="resetPlacement" class="reset" type="button" aria-label="reset placement" title="reset">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M3.2 8A4.8 4.8 0 1 0 8 3.2"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <path d="M3.2 3.2v3.2H6.4" fill="none" stroke="currentColor" stroke-width="1.5" />
                  </svg>
                </button>
              </summary>
              <div id="placementControls"></div>
            </details>

            <details class="pane" id="effects">
              <summary>
                <span>affect</span>
                <button id="resetEffects" class="reset" type="button" aria-label="reset affect" title="reset">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M3.2 8A4.8 4.8 0 1 0 8 3.2"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <path d="M3.2 3.2v3.2H6.4" fill="none" stroke="currentColor" stroke-width="1.5" />
                  </svg>
                </button>
              </summary>
              <div class="field compact color-field">
                <span>color</span>
                <div class="dial">
                  <input
                    id="pigmentColor"
                    type="text"
                    value="#8b2f32"
                    maxlength="7"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="hex"
                  />
                  <canvas id="colorDial" width="50" height="50" aria-label="color dial"></canvas>
                </div>
              </div>
              <div class="effect-groups" id="effectGroups"></div>
            </details>

            <div class="pane sketch-bar" id="sketch">
              <div class="sketch-bar-row">
                <span>sketch</span>
                <div class="code-actions">
                  <button id="rerender" type="button">re-render</button>
                  <button id="download" type="button">png</button>
                </div>
              </div>
            </div>

            <details class="keys">
              <summary>api key</summary>
              <label class="field compact">
                <span>provider</span>
                <select id="provider">
                  <option value="grok">grok (xai)</option>
                  <option value="anthropic">anthropic</option>
                  <option value="openai">openai</option>
                </select>
              </label>
              <label class="field">
                <span>key</span>
                <input id="apiKey" type="password" autocomplete="off" placeholder="xai-…" />
              </label>
            </details>
          </div>
        </details>
      </aside>

      <section class="wall" id="wall" aria-live="polite"></section>
    </main>

    <iframe id="renderer" class="renderer" title="watercolor renderer" src="renderer.html?v=39"></iframe>
    <script type="module" src="app.js?v=66"></script>
  </body>
</html>
