<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>text editor - maya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=9">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Libre Baskerville', serif;
            background-color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background-color: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }

        .toolbar-button {
            background: none;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-family: 'Libre Baskerville', serif;
            font-size: 13px;
            color: #333;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .toolbar-button:hover {
            background-color: #f0f0f0;
        }

        .toolbar-button.active {
            background-color: #f9e04c;
            color: #333;
        }

        .toolbar-button.bold.active {
            font-weight: bold;
        }

        .toolbar-button.italic.active {
            font-style: italic;
        }

        .toolbar-button.underline.active {
            text-decoration: underline;
        }

        .toolbar-separator {
            width: 1px;
            height: 20px;
            background-color: #e0e0e0;
            margin: 0 4px;
        }

        .color-button {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-button:hover {
            transform: scale(1.1);
            border-color: #999;
        }

        .color-button.red {
            background-color: #d32f2f;
        }

        .color-button.yellow {
            background-color: #f9e04c;
        }

        .color-button.black {
            background-color: #000000;
        }

        .editor-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        #editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: 'Libre Baskerville', serif;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            background: transparent;
            resize: none;
            padding: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #editor:empty:before {
            content: attr(placeholder);
            color: #999;
            font-style: italic;
            pointer-events: none;
        }

        /* Bullet list styling */
        #editor ul {
            list-style-type: disc;
            margin-left: 1.5em;
            padding-left: 0.5em;
        }

        #editor ul li {
            margin: 0.3em 0;
            line-height: 1.8;
        }

        #editor ul ul {
            list-style-type: circle;
        }

        #editor ul ul ul {
            list-style-type: square;
        }

        /* Text selection colors */
        ::selection {
            background-color: #f9e04c;
            color: #333;
        }

        ::-moz-selection {
            background-color: #f9e04c;
            color: #333;
        }

        /* Scrollbar styling */
        .editor-content::-webkit-scrollbar {
            width: 12px;
        }

        .editor-content::-webkit-scrollbar-track {
            background: #fafafa;
        }

        .editor-content::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 6px;
        }

        .editor-content::-webkit-scrollbar-thumb:hover {
            background: #b0b0b0;
        }

        /* Floating toolbar for text selection */
        .floating-toolbar {
            position: absolute;
            display: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: 6px;
            z-index: 1000;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .floating-toolbar.show {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .floating-toolbar .toolbar-button,
        .floating-toolbar .color-button {
            margin: 0 2px;
        }

        .floating-toolbar .toolbar-separator {
            margin: 0 4px;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .editor-content {
                padding: 20px;
            }

            .toolbar {
                padding: 8px 12px;
                flex-wrap: wrap;
            }

            #editor {
                font-size: 14px;
            }

            .floating-toolbar {
                padding: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="toolbar">
            <button class="toolbar-button bold" id="bold-btn" onclick="formatText('bold')" title="Bold (⌘B)">B</button>
            <button class="toolbar-button italic" id="italic-btn" onclick="formatText('italic')" title="Italic (⌘I)">I</button>
            <button class="toolbar-button underline" id="underline-btn" onclick="formatText('underline')" title="Underline (⌘U)">U</button>
            <div class="toolbar-separator"></div>
            <div class="color-button red" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#d32f2f');" title="Red"></div>
            <div class="color-button yellow" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#f9e04c');" title="Yellow"></div>
            <div class="color-button black" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#000000');" title="Black"></div>
            <div class="toolbar-separator"></div>
            <button class="toolbar-button" id="bullet-btn" onclick="formatText('insertUnorderedList')" title="Bullet List (⌘⇧8)">•</button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-button" onclick="clearEditor()" title="Clear">Clear</button>
        </div>
        <div class="editor-content">
            <div id="editor" contenteditable="true" placeholder="start writing..."></div>
            <div id="floating-toolbar" class="floating-toolbar">
                <button class="toolbar-button bold" onclick="formatText('bold')" title="Bold (⌘B)">B</button>
                <button class="toolbar-button italic" onclick="formatText('italic')" title="Italic (⌘I)">I</button>
                <button class="toolbar-button underline" onclick="formatText('underline')" title="Underline (⌘U)">U</button>
                <div class="toolbar-separator"></div>
                <div class="color-button red" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#d32f2f');" title="Red"></div>
                <div class="color-button yellow" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#f9e04c');" title="Yellow"></div>
                <div class="color-button black" onclick="event.preventDefault(); event.stopPropagation(); setTextColor('#000000');" title="Black"></div>
                <div class="toolbar-separator"></div>
                <button class="toolbar-button" onclick="formatText('insertUnorderedList')" title="Bullet List (⌘⇧8)">•</button>
            </div>
        </div>
    </div>

    <script>
        // Load saved content from localStorage
        function loadContent() {
            const savedContent = localStorage.getItem('text-editor-content');
            if (savedContent) {
                document.getElementById('editor').innerHTML = savedContent;
            }
        }

        // Save content to localStorage
        function saveContent() {
            const content = document.getElementById('editor').innerHTML;
            localStorage.setItem('text-editor-content', content);
        }

        // Auto-save as user types
        const editor = document.getElementById('editor');
        let saveTimeout;
        editor.addEventListener('input', function() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });

        // Save on blur
        editor.addEventListener('blur', saveContent);

        // Store current selection
        let savedSelection = null;

        function saveSelection() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                savedSelection = selection.getRangeAt(0).cloneRange();
            }
        }

        function restoreSelection() {
            if (savedSelection) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(savedSelection);
            }
        }

        // Format text (bold, italic, underline, bullet list)
        function formatText(command) {
            // Save selection before any focus changes
            saveSelection();
            
            // Restore selection and apply command
            restoreSelection();
            editor.focus();
            
            // For bullet lists, ensure we're working with the selection
            if (command === 'insertUnorderedList') {
                const selection = window.getSelection();
                if (selection.rangeCount > 0 && !selection.isCollapsed) {
                    // Selection exists, use insertUnorderedList
                    document.execCommand('insertUnorderedList', false, null);
                } else {
                    // No selection, create a new list item
                    const listItem = document.createElement('li');
                    listItem.textContent = '\u200B'; // Zero-width space to make it editable
                    const ul = document.createElement('ul');
                    ul.appendChild(listItem);
                    
                    // Insert at cursor position
                    const range = selection.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(ul);
                    
                    // Move cursor inside the list item
                    range.setStart(listItem, 0);
                    range.setEnd(listItem, 0);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            } else {
                document.execCommand(command, false, null);
            }
            
            // Update toolbar state and show it again
            updateToolbarState();
            setTimeout(() => {
                showFloatingToolbar();
            }, 10);
        }

        // Set text color
        function setTextColor(color) {
            // Save selection before anything else
            saveSelection();
            
            // Restore selection
            restoreSelection();
            
            // Get current selection
            const selection = window.getSelection();
            
            if (selection.rangeCount > 0 && !selection.isCollapsed) {
                // Text is selected - wrap it in a span with the color
                const range = selection.getRangeAt(0);
                
                try {
                    // Extract selected content
                    const contents = range.extractContents();
                    
                    // Create span with color
                    const span = document.createElement('span');
                    span.style.color = color;
                    span.style.setProperty('color', color, 'important'); // Force with !important
                    
                    // Wrap all nodes in the span
                    if (contents.childNodes.length > 0) {
                        while (contents.childNodes.length > 0) {
                            span.appendChild(contents.childNodes[0]);
                        }
                    } else if (contents.textContent) {
                        span.textContent = contents.textContent;
                    }
                    
                    // Insert the span
                    range.insertNode(span);
                    
                    // Update selection to be at the end of the span
                    const newRange = document.createRange();
                    newRange.setStartAfter(span);
                    newRange.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } catch (e) {
                    console.error('Error applying color:', e);
                    // Fallback to execCommand
                    editor.focus();
                    document.execCommand('styleWithCSS', false, 'true');
                    document.execCommand('foreColor', false, color);
                    document.execCommand('styleWithCSS', false, 'false');
                }
            } else {
                // No selection - use execCommand for future text
                editor.focus();
                document.execCommand('styleWithCSS', false, 'true');
                document.execCommand('foreColor', false, color);
                document.execCommand('styleWithCSS', false, 'false');
            }
            
            // Force save content
            saveContent();
            
            // Update toolbar state and show it again
            updateToolbarState();
            setTimeout(() => {
                showFloatingToolbar();
            }, 10);
        }

        // Update toolbar button states based on current selection
        function updateToolbarState() {
            const isBold = document.queryCommandState('bold');
            const isItalic = document.queryCommandState('italic');
            const isUnderline = document.queryCommandState('underline');
            const isUnorderedList = document.queryCommandState('insertUnorderedList');
            
            const boldBtn = document.getElementById('bold-btn');
            const italicBtn = document.getElementById('italic-btn');
            const underlineBtn = document.getElementById('underline-btn');
            const bulletBtn = document.getElementById('bullet-btn');
            
            if (boldBtn) {
                if (isBold) {
                    boldBtn.classList.add('active');
                } else {
                    boldBtn.classList.remove('active');
                }
            }
            
            if (italicBtn) {
                if (isItalic) {
                    italicBtn.classList.add('active');
                } else {
                    italicBtn.classList.remove('active');
                }
            }
            
            if (underlineBtn) {
                if (isUnderline) {
                    underlineBtn.classList.add('active');
                } else {
                    underlineBtn.classList.remove('active');
                }
            }
            
            if (bulletBtn) {
                if (isUnorderedList) {
                    bulletBtn.classList.add('active');
                } else {
                    bulletBtn.classList.remove('active');
                }
            }
        }

        // Clear editor
        function clearEditor() {
            if (confirm('Clear all text?')) {
                editor.innerHTML = '';
                saveContent();
                editor.focus();
            }
        }

        // Keyboard shortcuts
        editor.addEventListener('keydown', function(e) {
            // Backspace at start of bullet list item - exit the list
            if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey) {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const container = range.startContainer;
                    const offset = range.startOffset;
                    
                    // Check if we're at the start of a list item (new line)
                    let listItem = null;
                    if (container.nodeType === Node.TEXT_NODE) {
                        listItem = container.parentElement;
                    } else if (container.nodeType === Node.ELEMENT_NODE) {
                        listItem = container;
                    }
                    
                    if (listItem && listItem.tagName === 'LI') {
                        // Check if we're at the very start of the list item (new line)
                        const isAtStart = offset === 0;
                        const isEmpty = listItem.textContent.trim() === '';
                        
                        if (isAtStart || isEmpty) {
                            e.preventDefault();
                            
                            // Get the list
                            const list = listItem.parentElement;
                            
                            // Create a paragraph to replace the list item
                            const p = document.createElement('p');
                            if (!isEmpty) {
                                // Move content to paragraph
                                while (listItem.firstChild) {
                                    p.appendChild(listItem.firstChild);
                                }
                            } else {
                                p.innerHTML = '<br>';
                            }
                            
                            // Replace list item with paragraph
                            listItem.parentNode.replaceChild(p, listItem);
                            
                            // If list is now empty, remove it
                            if (list && list.children.length === 0) {
                                if (list.parentNode) {
                                    list.parentNode.replaceChild(document.createTextNode(''), list);
                                }
                            }
                            
                            // Move cursor to the new paragraph
                            const newRange = document.createRange();
                            if (p.firstChild) {
                                if (p.firstChild.nodeType === Node.TEXT_NODE) {
                                    newRange.setStart(p.firstChild, p.firstChild.textContent.length);
                                } else {
                                    newRange.setStart(p, 0);
                                }
                            } else {
                                newRange.setStart(p, 0);
                            }
                            newRange.collapse(true);
                            selection.removeAllRanges();
                            selection.addRange(newRange);
                            
                            saveContent();
                            return;
                        }
                    }
                }
            }
            
            // Command/Ctrl + B for bold
            if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
                e.preventDefault();
                formatText('bold');
            }
            // Command/Ctrl + I for italic
            else if ((e.metaKey || e.ctrlKey) && e.key === 'i') {
                e.preventDefault();
                formatText('italic');
            }
            // Command/Ctrl + U for underline
            else if ((e.metaKey || e.ctrlKey) && e.key === 'u') {
                e.preventDefault();
                formatText('underline');
            }
            // Command/Ctrl + A for select all
            else if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
                // Allow default behavior (select all)
            }
            // Command/Ctrl + Z for undo
            else if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                document.execCommand('undo');
                saveContent();
            }
            // Command/Ctrl + Shift + Z for redo
            else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'z') {
                e.preventDefault();
                document.execCommand('redo');
                saveContent();
            }
            // Command/Ctrl + Y for redo
            else if ((e.metaKey || e.ctrlKey) && e.key === 'y') {
                e.preventDefault();
                document.execCommand('redo');
                saveContent();
            }
            // Command/Ctrl + Shift + 8 for bullet list
            else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === '8') {
                e.preventDefault();
                formatText('insertUnorderedList');
            }
            // Dash/hyphen (-) at start of line for bullet list
            else if (e.key === '-' && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const container = range.startContainer;
                    const offset = range.startOffset;
                    
                    // Check if we're at the start of a line
                    let isAtLineStart = false;
                    
                    if (container.nodeType === Node.TEXT_NODE) {
                        const text = container.textContent;
                        const beforeCursor = text.substring(0, offset);
                        // Check if we're at the start or after only whitespace/newline
                        if (offset === 0 || beforeCursor.match(/^\s*$/)) {
                            isAtLineStart = true;
                        }
                    } else if (container.nodeType === Node.ELEMENT_NODE && offset === 0) {
                        isAtLineStart = true;
                    }
                    
                    if (isAtLineStart) {
                        e.preventDefault();
                        // Create bullet list directly
                        formatText('insertUnorderedList');
                    }
                }
            }
            // Command/Ctrl + S for save
            else if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                saveContent();
            }
        });

        // Floating toolbar for text selection
        const floatingToolbar = document.getElementById('floating-toolbar');
        let hideToolbarTimeout;

        function showFloatingToolbar() {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
                hideFloatingToolbar();
                return;
            }

            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            const editorContent = editor.parentElement;
            const editorContentRect = editorContent.getBoundingClientRect();
            
            // Make toolbar visible temporarily to measure it
            floatingToolbar.style.visibility = 'hidden';
            floatingToolbar.style.display = 'flex';
            const toolbarRect = floatingToolbar.getBoundingClientRect();
            
            // Position toolbar above selection, centered horizontally
            // Calculate position relative to editor content
            const scrollTop = editorContent.scrollTop;
            const scrollLeft = editorContent.scrollLeft;
            
            // Get the selection position relative to the editor
            const editorRect = editor.getBoundingClientRect();
            const selectionTop = rect.top - editorRect.top + scrollTop;
            const selectionLeft = rect.left - editorRect.left + scrollLeft;
            const selectionWidth = rect.width;
            
            // Position above the selection with some spacing
            let top = selectionTop - toolbarRect.height - 8;
            let left = selectionLeft + (selectionWidth / 2) - (toolbarRect.width / 2);

            // Keep toolbar within editor bounds horizontally
            if (left < scrollLeft + 10) {
                left = scrollLeft + 10;
            }
            if (left + toolbarRect.width > scrollLeft + editorContentRect.width - 10) {
                left = scrollLeft + editorContentRect.width - toolbarRect.width - 10;
            }

            // If toolbar would be above visible area, show it below selection instead
            if (top < scrollTop + 10) {
                top = selectionTop + rect.height + 8;
            }

            floatingToolbar.style.top = top + 'px';
            floatingToolbar.style.left = left + 'px';
            floatingToolbar.style.visibility = 'visible';
            
            // Save selection when toolbar appears
            saveSelection();
            
            clearTimeout(hideToolbarTimeout);
            floatingToolbar.classList.add('show');
            updateToolbarState();
        }

        function hideFloatingToolbar() {
            clearTimeout(hideToolbarTimeout);
            hideToolbarTimeout = setTimeout(() => {
                floatingToolbar.classList.remove('show');
            }, 100);
        }

        // Show floating toolbar on text selection
        document.addEventListener('selectionchange', function() {
            if (document.activeElement === editor) {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                    showFloatingToolbar();
                } else {
                    hideFloatingToolbar();
                }
                updateToolbarState();
            }
        });

        // Also update on mouseup (when selection changes via mouse)
        editor.addEventListener('mouseup', function() {
            setTimeout(() => {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                    showFloatingToolbar();
                } else {
                    hideFloatingToolbar();
                }
                updateToolbarState();
            }, 10);
        });

        editor.addEventListener('keyup', function() {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                showFloatingToolbar();
            } else {
                hideFloatingToolbar();
            }
            updateToolbarState();
        });

        // Hide toolbar when clicking outside
        document.addEventListener('mousedown', function(e) {
            if (!floatingToolbar.contains(e.target) && e.target !== editor) {
                hideFloatingToolbar();
            }
        });

        // Keep toolbar visible when clicking on it and preserve selection
        floatingToolbar.addEventListener('mousedown', function(e) {
            // Save selection before any interaction
            saveSelection();
            // Don't prevent default on color buttons - let the click handler work
            if (!e.target.classList.contains('color-button')) {
                e.preventDefault();
            }
            e.stopPropagation();
        });

        floatingToolbar.addEventListener('click', function(e) {
            e.stopPropagation();
            // For color buttons, restore selection immediately
            if (e.target.classList.contains('color-button')) {
                restoreSelection();
                editor.focus();
            }
        });

        // Save before page unload
        window.addEventListener('beforeunload', saveContent);
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                saveContent();
            }
        });

        // Load content on page load
        loadContent();
        
        // Focus editor on load
        setTimeout(() => {
            editor.focus();
        }, 100);
    </script>
</body>
</html>
