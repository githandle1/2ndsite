<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Maya's cabinet: a running list of photos, reads, and personal notes.">
    <title>maya's cabinet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=7">
    <style>
        :root {
            color-scheme: light;
            --paper: #faf9f6;
            --ink: #24211f;
            --hover: #8b2f32;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Libre Baskerville", serif;
            font-size: 15px;
            line-height: 1.65;
        }

        main {
            width: min(100% - 48px, 720px);
            margin: 0 auto;
            padding: 72px 0 96px;
        }

        h1 {
            margin: 0 0 64px;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        section {
            margin: 0 0 40px;
        }

        h4 {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.65;
        }

        p {
            margin: 0;
        }

        .photo-entry {
            border-bottom: 1px solid rgba(36, 33, 31, 0.16);
        }

        .photo-entry:first-of-type {
            border-top: 1px solid rgba(36, 33, 31, 0.16);
        }

        .photo-entry summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            cursor: pointer;
            list-style: none;
            transition: color 180ms ease;
        }

        .photo-entry summary::-webkit-details-marker {
            display: none;
        }

        .photo-entry summary::after {
            content: "+";
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1;
        }

        .photo-entry[open] summary::after {
            content: "−";
        }

        .photo-entry summary:hover,
        .photo-entry summary:focus-visible {
            color: var(--hover);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 4px 0 16px;
        }

        .photo-slot {
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            background: #f1eee8;
            border: 1px solid rgba(36, 33, 31, 0.12);
            color: rgba(36, 33, 31, 0.48);
            font-size: 0.65rem;
            overflow: hidden;
        }

        .photo-slot.photo-thumb {
            cursor: pointer;
            padding: 0;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .photo-slot.photo-thumb:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 14px rgba(36, 33, 31, 0.14);
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .polaroid-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        .polaroid-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .polaroid-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(36, 33, 31, 0.58);
            border: none;
            cursor: pointer;
        }

        .polaroid {
            position: relative;
            z-index: 1;
            margin: 0;
            width: min(90vw, 480px);
            background: #fff;
            padding: 14px 14px 46px;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.08),
                0 12px 40px rgba(0, 0, 0, 0.22);
            transform: scale(0.94);
            transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .polaroid-overlay.is-open .polaroid {
            transform: scale(1);
        }

        .polaroid-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #f1eee8;
        }

        .polaroid-caption {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 10px;
            text-align: right;
        }

        .polaroid-timestamp {
            display: block;
            margin-bottom: 6px;
            font-size: 0.53rem;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            color: rgba(36, 33, 31, 0.45);
        }

        .polaroid-note {
            margin: 0;
            font-size: 0.78rem;
            line-height: 1.4;
            color: var(--ink);
        }

        .polaroid-close {
            position: absolute;
            top: -12px;
            right: -12px;
            z-index: 2;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(36, 33, 31, 0.12);
            border-radius: 50%;
            background: #fff;
            color: var(--ink);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .polaroid-close:hover {
            color: var(--hover);
        }

        .phrase {
            width: fit-content;
            transition: color 180ms ease;
        }

        .phrase:hover,
        .phrase:focus-visible {
            color: var(--hover);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 32px;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            main {
                width: min(100% - 32px, 720px);
                padding-top: 40px;
            }

            h1 {
                margin-bottom: 48px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 class="phrase">filings</h1>

        <section aria-labelledby="currently-reading">
            <h4 id="currently-reading" class="phrase">currently reading</h4>
        </section>

        <section aria-labelledby="photos">
            <h4 id="photos" class="phrase">photos</h4>
            <details class="photo-entry">
                <summary>nyc, july 2026</summary>
                <div class="photo-grid" aria-label="NYC photo gallery">
                    <button type="button" class="photo-slot photo-thumb" data-src="photos/cursor.jpeg" data-note="central park, august 2026" aria-label="Open Central Park photo">
                        <img src="photos/cursor.jpeg" alt="Central Park, NYC">
                    </button>
                    <button type="button" class="photo-slot photo-thumb" data-src="photos/williamsburg-bridge.jpeg" data-note="sheep's meadow, august 2026" aria-label="Open Sheep Meadow photo">
                        <img src="photos/williamsburg-bridge.jpeg" alt="Williamsburg Bridge, East River">
                    </button>
                    <button type="button" class="photo-slot photo-thumb" data-src="photos/sheep-meadow.jpeg" data-note="williamsburg bridge, july 2026" aria-label="Open Williamsburg Bridge photo">
                        <img src="photos/sheep-meadow.jpeg" alt="Sheep Meadow, Central Park">
                    </button>
                    <div class="photo-slot">04</div>
                    <div class="photo-slot">05</div>
                    <div class="photo-slot">06</div>
                    <div class="photo-slot">07</div>
                    <div class="photo-slot">08</div>
                    <div class="photo-slot">09</div>
                </div>
            </details>
            <details class="photo-entry">
                <summary>london, july 2026</summary>
                <div class="photo-grid" aria-label="London photo gallery">
                    <div class="photo-slot">01</div>
                    <div class="photo-slot">02</div>
                    <div class="photo-slot">03</div>
                    <div class="photo-slot">04</div>
                    <div class="photo-slot">05</div>
                    <div class="photo-slot">06</div>
                    <div class="photo-slot">07</div>
                    <div class="photo-slot">08</div>
                    <div class="photo-slot">09</div>
                </div>
            </details>
            <details class="photo-entry">
                <summary>paris, july 2026</summary>
                <div class="photo-grid" aria-label="Paris photo gallery">
                    <div class="photo-slot">01</div>
                    <div class="photo-slot">02</div>
                    <div class="photo-slot">03</div>
                    <div class="photo-slot">04</div>
                    <div class="photo-slot">05</div>
                    <div class="photo-slot">06</div>
                    <div class="photo-slot">07</div>
                    <div class="photo-slot">08</div>
                    <div class="photo-slot">09</div>
                </div>
            </details>
        </section>

        <section aria-labelledby="reads">
            <h4 id="reads" class="phrase">reads</h4>
        </section>

        <a class="back-link phrase" href="index.html">← back</a>
    </main>

    <div class="polaroid-overlay" id="polaroid-overlay" hidden aria-hidden="true">
        <button type="button" class="polaroid-backdrop" aria-label="Close photo preview"></button>
        <figure class="polaroid">
            <button type="button" class="polaroid-close" aria-label="Close photo preview">×</button>
            <img class="polaroid-image" src="" alt="">
            <figcaption class="polaroid-caption">
                <time class="polaroid-timestamp"></time>
                <p class="polaroid-note"></p>
            </figcaption>
        </figure>
    </div>

    <script>
        const overlay = document.getElementById('polaroid-overlay');
        const polaroidImage = overlay.querySelector('.polaroid-image');
        const polaroidTimestamp = overlay.querySelector('.polaroid-timestamp');
        const polaroidNote = overlay.querySelector('.polaroid-note');
        const backdrop = overlay.querySelector('.polaroid-backdrop');
        const closeButton = overlay.querySelector('.polaroid-close');

        function openPolaroid(thumb) {
            polaroidImage.src = thumb.dataset.src;
            polaroidImage.alt = thumb.querySelector('img')?.alt || '';

            const timestamp = thumb.dataset.timestamp || '';
            const note = thumb.dataset.note || '';

            polaroidTimestamp.textContent = timestamp;
            polaroidTimestamp.hidden = !timestamp;
            polaroidNote.textContent = note;
            polaroidNote.hidden = !note;

            overlay.hidden = false;
            overlay.setAttribute('aria-hidden', 'false');
            requestAnimationFrame(() => overlay.classList.add('is-open'));
            document.body.style.overflow = 'hidden';
            closeButton.focus();
        }

        function closePolaroid() {
            overlay.classList.remove('is-open');
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';

            window.setTimeout(() => {
                if (!overlay.classList.contains('is-open')) {
                    overlay.hidden = true;
                    polaroidImage.removeAttribute('src');
                }
            }, 220);
        }

        document.querySelectorAll('.photo-thumb').forEach((thumb) => {
            thumb.addEventListener('click', () => openPolaroid(thumb));
        });

        backdrop.addEventListener('click', closePolaroid);
        closeButton.addEventListener('click', closePolaroid);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && overlay.classList.contains('is-open')) {
                closePolaroid();
            }
        });
    </script>
</body>
</html>
