<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Maya's cabinet: a running list of photos, reads, and personal notes.">
    <title>maya's cabinet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=7">
    <style>
        :root {
            color-scheme: light;
            --paper: #faf9f6;
            --ink: #24211f;
            --hover: #8b2f32;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Libre Baskerville", serif;
            font-size: 15px;
            line-height: 1.65;
        }

        main {
            width: min(100% - 48px, 720px);
            margin: 0 auto;
            padding: 72px 0 96px;
        }

        h1 {
            margin: 0 0 64px;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        section {
            margin: 0 0 40px;
        }

        h4 {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.65;
        }

        p {
            margin: 0;
        }

        .phrase {
            width: fit-content;
            transition: color 180ms ease;
        }

        .phrase:hover,
        .phrase:focus-visible {
            color: var(--hover);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 32px;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            main {
                width: min(100% - 32px, 720px);
                padding-top: 40px;
            }

            h1 {
                margin-bottom: 48px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 class="phrase">filed away.</h1>

        <section aria-labelledby="currently-reading">
            <h4 id="currently-reading" class="phrase">currently reading:</h4>
            <p class="phrase">the proof is in the code by kevin hartnett</p>
        </section>

        <section aria-labelledby="photos">
            <h4 id="photos" class="phrase">photos</h4>
            <p class="phrase">nyc, july 2026</p>
            <p class="phrase">london, july 2026</p>
            <p class="phrase">paris, july 2026</p>
        </section>

        <section aria-labelledby="reads">
            <h4 id="reads" class="phrase">reads</h4>
            <p class="phrase">the proof is in the code by kevin hartnett</p>
        </section>

        <a class="back-link phrase" href="index.html">← back</a>
    </main>
</body>
</html>
