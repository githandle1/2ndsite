<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Prince Star Field</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: none;
            background: transparent;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        #stormCanvas {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        #canvas {
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 100;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        .black-overlay.active {
            opacity: 1;
        }

        .light-switch {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 25px;
            background: linear-gradient(to bottom, rgba(42, 42, 42, 0.5) 0%, rgba(26, 26, 26, 0.5) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            z-index: 200;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: all;
            backdrop-filter: blur(5px);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .light-switch::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 17px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2),
                0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .light-switch.on::before {
            transform: translateX(14px);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .light-switch::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 6px;
            width: 2px;
            height: 13px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 1px;
            transition: opacity 0.2s ease;
        }

        .light-switch.on::after {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <canvas id="stormCanvas"></canvas>
        <div class="stars" id="stars"></div>
        <div class="black-overlay" id="blackOverlay"></div>
        <div class="light-switch" id="lightSwitch"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stormCanvas = document.getElementById('stormCanvas');
        const stormCtx = stormCanvas.getContext('2d');
        const blackOverlay = document.getElementById('blackOverlay');
        const lightSwitch = document.getElementById('lightSwitch');
        
        // Light switch state - starts OFF (original view)
        let switchOn = false;
        
        // Set canvas size to match window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stormCanvas.width = window.innerWidth;
            stormCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        
        // Storm canvas styling
        stormCanvas.style.position = 'absolute';
        stormCanvas.style.top = '0';
        stormCanvas.style.left = '0';
        stormCanvas.style.width = '100%';
        stormCanvas.style.height = '100%';
        stormCanvas.style.zIndex = '101';
        stormCanvas.style.pointerEvents = 'none';
        stormCanvas.style.opacity = '0';
        stormCanvas.style.display = 'block';
        
        // Storm state
        let stormActive = false;
        let stormStars = [];
        
        // Animation variables
        let animationId;
        let shootingStars = [];
        let asteroids = [];
        let stars = [];
        
        // Interaction variables
        let isDragging = false;
        let draggedStar = null;
        let mouseX = 0;
        let mouseY = 0;
        
        // Create background stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 75; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // Initialize shooting stars
        function initShootingStars() {
            for (let i = 0; i < 12; i++) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 100 + 60,
                    speed: Math.random() * 2.5 + 1.5,
                    angle: Math.random() * Math.PI * 2,
                    opacity: Math.random() * 0.7 + 0.3,
                    life: Math.random() * 120 + 80,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }
        
        // Initialize asteroids
        function initAsteroids() {
            for (let i = 0; i < 19; i++) {
                asteroids.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 18 + 12,
                    speed: Math.random() * 0.6 + 0.3,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.03,
                    color: `hsl(${Math.random() * 60 + 30}, 80%, ${Math.random() * 30 + 60}%)`,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.05 + 0.02
                });
            }
        }
        
        // Draw shooting star
        function drawShootingStar(star) {
            ctx.save();
            ctx.translate(star.x, star.y);
            ctx.rotate(star.angle);
            
            // Calculate scintillation effect
            const twinkle = Math.sin(star.twinklePhase) * 0.2 + 0.8;
            const currentOpacity = star.opacity * twinkle;
            
            // Add a bright, larger head to the shooting star
            ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
            ctx.beginPath();
            ctx.arc(0, 0, 5 + twinkle * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Add a subtle glow around the head
            ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity * 0.3})`;
            ctx.beginPath();
            ctx.arc(0, 0, 8 + twinkle * 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.save();
            ctx.translate(asteroid.x, asteroid.y);
            ctx.rotate(asteroid.rotation);
            
            // Calculate scintillation effect
            const twinkle = Math.sin(asteroid.twinklePhase) * 0.3 + 0.7;
            const twinkleSize = asteroid.size * twinkle;
            
            // Create larger, more visible 5-pointed star shape
            ctx.fillStyle = asteroid.color;
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3 + twinkle;
            ctx.beginPath();
            
            const spikes = 5;
            const outerRadius = twinkleSize;
            const innerRadius = twinkleSize * 0.4;
            
            for (let i = 0; i < spikes * 2; i++) {
                const angle = (i / (spikes * 2)) * Math.PI * 2;
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Toggle between storm and original view
        function toggleView() {
            switchOn = !switchOn;
            
            if (switchOn) {
                // Switch ON = Activate star storm
                initStarStorm();
                
                // Smooth transitions
                setTimeout(() => {
                    stormCanvas.style.opacity = '1';
                    canvas.style.opacity = '0';
                    document.getElementById('stars').style.opacity = '0';
                }, 50);
            } else {
                // Switch OFF = Return to original view
                document.body.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
                document.body.style.transition = 'background 1.5s ease-in-out';
                blackOverlay.classList.remove('active');
                
                // Smooth transitions
                stormCanvas.style.opacity = '0';
                canvas.style.opacity = '1';
                document.getElementById('stars').style.opacity = '1';
                
                stormActive = false;
            }
            
            lightSwitch.classList.toggle('on', switchOn);
        }
        
        // Initialize star storm
        function initStarStorm() {
            // Reset and create stars
            stormStars = [];
            for (let i = 0; i < 500; i++) {
                stormStars.push({
                    x: Math.random() * stormCanvas.width + stormCanvas.width, // Start from right
                    y: Math.random() * stormCanvas.height,
                    size: Math.random() * 3 + 1, // Small stars (1-4px)
                    speed: Math.random() * 8 + 4, // Fast movement right to left
                    opacity: Math.random() * 0.6 + 0.3, // Translucent (0.3-0.9)
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.1 + 0.05, // Fast scintillation
                    glowSize: Math.random() * 4 + 2 // Glow radius for scintillation
                });
            }
            
            // Activate black overlay and change background
            document.body.style.background = '#000000';
            document.body.style.transition = 'background 1.5s ease-in-out';
            blackOverlay.classList.add('active');
            stormActive = true;
        }
        
        // Update star storm
        function updateStarStorm() {
            stormStars.forEach((star, index) => {
                // Move from right to left
                star.x -= star.speed;
                star.twinklePhase += star.twinkleSpeed;
                
                // Reset when off screen
                if (star.x < -star.size - star.glowSize) {
                    star.x = stormCanvas.width + star.size + star.glowSize;
                    star.y = Math.random() * stormCanvas.height;
                }
            });
        }
        
        // Draw star storm
        function drawStarStorm() {
            stormCtx.clearRect(0, 0, stormCanvas.width, stormCanvas.height);
            
            stormStars.forEach(star => {
                // Calculate scintillation effect
                const twinkle = Math.sin(star.twinklePhase) * 0.4 + 0.6;
                const currentOpacity = star.opacity * twinkle;
                
                // Create scintillating glow effect
                const gradient = stormCtx.createRadialGradient(
                    star.x, star.y, 0,
                    star.x, star.y, star.glowSize * twinkle
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${currentOpacity})`);
                gradient.addColorStop(0.5, `rgba(255, 255, 255, ${currentOpacity * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                stormCtx.fillStyle = gradient;
                stormCtx.beginPath();
                stormCtx.arc(star.x, star.y, star.glowSize * twinkle, 0, Math.PI * 2);
                stormCtx.fill();
                
                // Core bright point
                stormCtx.fillStyle = `rgba(255, 255, 255, ${currentOpacity * 1.2})`;
                stormCtx.beginPath();
                stormCtx.arc(star.x, star.y, star.size * twinkle * 0.5, 0, Math.PI * 2);
                stormCtx.fill();
            });
        }
        
        // Update animation
        function update() {
            if (stormActive && switchOn) {
                // Update storm when active and switch is ON
                updateStarStorm();
            } else {
                // Update asteroids only
                asteroids.forEach(asteroid => {
                    asteroid.x -= asteroid.speed;
                    asteroid.rotation += asteroid.rotationSpeed;
                    asteroid.twinklePhase += asteroid.twinkleSpeed;
                    
                    // Reset asteroid position when it goes off screen
                    if (asteroid.x < -asteroid.size * 2) {
                        asteroid.x = canvas.width + asteroid.size * 2;
                        asteroid.y = Math.random() * canvas.height;
                        asteroid.twinklePhase = Math.random() * Math.PI * 2;
                    }
                });
            }
        }
        
        // Draw everything
        function draw() {
            if (stormActive && switchOn) {
                // Draw storm when active and switch is ON
                drawStarStorm();
            } else {
                // Original view when switch is OFF
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                asteroids.forEach(drawAsteroid);
            }
        }
        
        // Mouse/Touch interaction functions
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }
        
        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        }
        
        function findStarAt(x, y) {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const star = asteroids[i];
                const distance = Math.sqrt((star.x - x) ** 2 + (star.y - y) ** 2);
                if (distance < star.size + 10) {
                    return star;
                }
            }
            return null;
        }
        
        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const star = findStarAt(pos.x, pos.y);
            if (star) {
                isDragging = true;
                draggedStar = star;
                mouseX = pos.x;
                mouseY = pos.y;
                canvas.style.cursor = 'grabbing';
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            
            if (isDragging && draggedStar) {
                draggedStar.x = pos.x;
                draggedStar.y = pos.y;
            } else {
                const star = findStarAt(pos.x, pos.y);
                canvas.style.cursor = star ? 'grab' : 'default';
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            draggedStar = null;
            canvas.style.cursor = 'default';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedStar = null;
            canvas.style.cursor = 'default';
        });
        
        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e);
            const star = findStarAt(pos.x, pos.y);
            if (star) {
                isDragging = true;
                draggedStar = star;
                mouseX = pos.x;
                mouseY = pos.y;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            
            if (isDragging && draggedStar) {
                draggedStar.x = pos.x;
                draggedStar.y = pos.y;
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
            draggedStar = null;
        });
        
        // Animation loop
        function animate() {
            update();
            draw();
            animationId = requestAnimationFrame(animate);
        }
        
        // Light switch click handler
        lightSwitch.addEventListener('click', toggleView);
        
        // Initialize everything
        createStars();
        initShootingStars();
        initAsteroids();
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Reinitialize asteroids to match new canvas size
            asteroids = [];
            initAsteroids();
            // Reset storm stars if active
            if (stormActive && switchOn) {
                stormStars = [];
                initStarStorm();
            }
        });
    </script>
</body>
</html>
