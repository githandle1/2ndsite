<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Prince Star Field</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: none;
            background: transparent;
            z-index: 1;
        }

        .music-player {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 200px;
            height: 60px;
            background: transparent;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 20px;
        }

        .music-player:hover {
            transform: scale(1.02);
        }

        .youtube-player {
            position: absolute;
            top: -1000px;
            left: -1000px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        .youtube-player iframe {
            width: 1px;
            height: 1px;
            border: none;
        }

        .playlist-controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .playlist-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .playlist-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 0;
            backdrop-filter: blur(5px);
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.15);
        }

        .song-info {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Dancing Script', cursive;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            white-space: nowrap;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .sign {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            text-shadow: 
                1px 1px 0px rgba(0, 0, 0, 0.8),
                -1px -1px 0px rgba(255, 255, 255, 0.1),
                0px 0px 2px rgba(0, 0, 0, 0.6);
            z-index: 10;
            letter-spacing: 0.5px;
            transform: rotate(-1deg);
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .sign:hover {
            transform: rotate(0deg) scale(1.1);
            opacity: 0.8;
            color: rgba(255, 255, 255, 0.4);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sign">maya's 27th</div>
        <canvas id="canvas" width="1200" height="800"></canvas>
        
        <div class="music-player">
            <div class="youtube-player">
                <iframe id="youtubePlayer" 
                        width="300" 
                        height="200" 
                        src="https://www.youtube.com/embed/lpCJKgEnE84?autoplay=0&controls=1&showinfo=0&rel=0&modestbranding=1"
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>
            <div class="playlist-controls">
                <button class="playlist-btn" id="prevBtn">⏮</button>
                <button class="play-btn" id="playBtn">▶</button>
                <button class="playlist-btn" id="nextBtn">⏭</button>
            </div>
            <div class="song-info" id="songInfo">Loading...</div>
        </div>
        
        <div class="stars" id="stars"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // YouTube playlist
        const playlist = [
            { id: 'lpCJKgEnE84' },
            { id: 'QwhkvO_hCOM' },
            { id: 'Yl0awrtbQO4' },
            { id: 'smdYRCo5v8U' },
            { id: '7N5JpeKRP3I' },
            { id: '4OtouIGhwkU' },
            { id: 'K0HSD_i2DvA' },
            { id: '3-W2IfwhBK8' },
            { id: 'nnN_96SnVRE' },
            { id: 'QiYOkmrI1jg' }
        ];
        
        // Function to fetch YouTube video title
        async function fetchVideoTitle(videoId) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                const data = await response.json();
                return data.title;
            } catch (error) {
                console.log('Error fetching video title:', error);
                return `Song ${playlist.findIndex(song => song.id === videoId) + 1}`;
            }
        }
        
        // Function to parse title into song and artist
        function parseTitle(title) {
            // Just return the full title as the song
            return {
                song: title
            };
        }
        
        // Function to load video titles
        async function loadVideoTitles() {
            for (let i = 0; i < playlist.length; i++) {
                const title = await fetchVideoTitle(playlist[i].id);
                const parsed = parseTitle(title);
                playlist[i].title = parsed.song;
            }
            updateCurrentSong();
        }
        
        let currentSongIndex = 0;
        let isPlaying = false;
        const youtubePlayer = document.getElementById('youtubePlayer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playBtn = document.getElementById('playBtn');
        
        // Update current song display
        function updateCurrentSong() {
            const currentSong = playlist[currentSongIndex];
            const songInfo = document.getElementById('songInfo');
            songInfo.textContent = currentSong.title || `Song ${currentSongIndex + 1}`;
        }
        
        // Load YouTube video
        function loadVideo(videoId, autoplay = false) {
            const autoplayParam = autoplay ? '1' : '0';
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=${autoplayParam}&controls=1&showinfo=0&rel=0&modestbranding=1`;
            youtubePlayer.src = embedUrl;
            updateCurrentSong();
        }
        
        // Play/Pause functionality
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                loadVideo(playlist[currentSongIndex].id, true);
                playBtn.textContent = '⏸';
                isPlaying = true;
            } else {
                playBtn.textContent = '▶';
                isPlaying = false;
            }
        });
        
        // Previous song
        prevBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            if (isPlaying) {
                loadVideo(playlist[currentSongIndex].id, true);
            } else {
                loadVideo(playlist[currentSongIndex].id, false);
            }
        });
        
        // Next song
        nextBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            if (isPlaying) {
                loadVideo(playlist[currentSongIndex].id, true);
            } else {
                loadVideo(playlist[currentSongIndex].id, false);
            }
        });
        
        // Animation variables
        let animationId;
        let shootingStars = [];
        let asteroids = [];
        let stars = [];
        
        // Interaction variables
        let isDragging = false;
        let draggedStar = null;
        let mouseX = 0;
        let mouseY = 0;
        
        // Create background stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 75; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // Initialize shooting stars
        function initShootingStars() {
            for (let i = 0; i < 12; i++) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 100 + 60,
                    speed: Math.random() * 2.5 + 1.5,
                    angle: Math.random() * Math.PI * 2,
                    opacity: Math.random() * 0.7 + 0.3,
                    life: Math.random() * 120 + 80,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }
        
        // Initialize asteroids
        function initAsteroids() {
            for (let i = 0; i < 19; i++) {
                asteroids.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 18 + 12,
                    speed: Math.random() * 0.6 + 0.3,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.03,
                    color: `hsl(${Math.random() * 60 + 30}, 80%, ${Math.random() * 30 + 60}%)`,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.05 + 0.02
                });
            }
        }
        
        // Draw shooting star
        function drawShootingStar(star) {
            ctx.save();
            ctx.translate(star.x, star.y);
            ctx.rotate(star.angle);
            
            // Calculate scintillation effect
            const twinkle = Math.sin(star.twinklePhase) * 0.2 + 0.8;
            const currentOpacity = star.opacity * twinkle;
            
            // Add a bright, larger head to the shooting star
            ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
            ctx.beginPath();
            ctx.arc(0, 0, 5 + twinkle * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Add a subtle glow around the head
            ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity * 0.3})`;
            ctx.beginPath();
            ctx.arc(0, 0, 8 + twinkle * 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.save();
            ctx.translate(asteroid.x, asteroid.y);
            ctx.rotate(asteroid.rotation);
            
            // Calculate scintillation effect
            const twinkle = Math.sin(asteroid.twinklePhase) * 0.3 + 0.7;
            const twinkleSize = asteroid.size * twinkle;
            
            // Create larger, more visible 5-pointed star shape
            ctx.fillStyle = asteroid.color;
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3 + twinkle;
            ctx.beginPath();
            
            const spikes = 5;
            const outerRadius = twinkleSize;
            const innerRadius = twinkleSize * 0.4;
            
            for (let i = 0; i < spikes * 2; i++) {
                const angle = (i / (spikes * 2)) * Math.PI * 2;
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Update animation
        function update() {
            // Update asteroids only
            asteroids.forEach(asteroid => {
                asteroid.x -= asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
                asteroid.twinklePhase += asteroid.twinkleSpeed;
                
                // Reset asteroid position when it goes off screen
                if (asteroid.x < -asteroid.size * 2) {
                    asteroid.x = canvas.width + asteroid.size * 2;
                    asteroid.y = Math.random() * canvas.height;
                    asteroid.twinklePhase = Math.random() * Math.PI * 2;
                }
            });
        }
        
        // Draw everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw asteroids (stars) only
            asteroids.forEach(drawAsteroid);
        }
        
        // Mouse/Touch interaction functions
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }
        
        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        }
        
        function findStarAt(x, y) {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const star = asteroids[i];
                const distance = Math.sqrt((star.x - x) ** 2 + (star.y - y) ** 2);
                if (distance < star.size + 10) {
                    return star;
                }
            }
            return null;
        }
        
        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const star = findStarAt(pos.x, pos.y);
            if (star) {
                isDragging = true;
                draggedStar = star;
                mouseX = pos.x;
                mouseY = pos.y;
                canvas.style.cursor = 'grabbing';
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            
            if (isDragging && draggedStar) {
                draggedStar.x = pos.x;
                draggedStar.y = pos.y;
            } else {
                const star = findStarAt(pos.x, pos.y);
                canvas.style.cursor = star ? 'grab' : 'default';
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            draggedStar = null;
            canvas.style.cursor = 'default';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedStar = null;
            canvas.style.cursor = 'default';
        });
        
        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e);
            const star = findStarAt(pos.x, pos.y);
            if (star) {
                isDragging = true;
                draggedStar = star;
                mouseX = pos.x;
                mouseY = pos.y;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            
            if (isDragging && draggedStar) {
                draggedStar.x = pos.x;
                draggedStar.y = pos.y;
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
            draggedStar = null;
        });
        
        // Animation loop
        function animate() {
            update();
            draw();
            animationId = requestAnimationFrame(animate);
        }
        
        // Initialize everything
        createStars();
        initShootingStars();
        initAsteroids();
        loadVideoTitles(); // Load actual YouTube titles
        loadVideo(playlist[currentSongIndex].id, true); // Autoplay on load
        isPlaying = true;
        playBtn.textContent = '⏸';
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
